# Development overrides — hot-reload 활성화
# Usage: docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up

services:
  api:
    build:
      target: dev
    volumes:
      - ../server/src:/app/server/src:cached
      - ../packages:/app/packages:cached
    environment:
      NODE_ENV: development
    command: ["pnpm", "--filter", "@educlip/server", "dev"]

  ui:
    build:
      context: ..
      dockerfile: ui/Dockerfile
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ../ui/src:/app/ui/src:cached
      - ../ui/index.html:/app/ui/index.html:cached
    environment:
      NODE_ENV: development
    command: ["pnpm", "--filter", "@educlip/ui", "dev", "--host", "0.0.0.0"]

  mcp-gateway:
    build:
      target: dev
    environment:
      NODE_ENV: development
      PORT: "3001"
    command: ["pnpm", "--filter", "@educlip/server", "tsx", "watch", "src/mcp/gateway.ts"]
